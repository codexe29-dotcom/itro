# Include inside the itro.co.in server block after setting:
#   root /var/www/itro/web/dist;
#   index index.html;

location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
}

location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
}

location = /llms.txt {
    default_type text/plain;
    try_files /llms.txt =404;
}

# API paths are served by the backend, never by the SPA fallback.
location = /api {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Public image assets only; private downloads go through authenticated /api routes.
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4000;
}

# Vite assets and public files (images, icons, manifest, fonts) must exist on disk.
location ^~ /assets/ {
    try_files $uri =404;
}

location ~* \.(?:avif|css|gif|ico|jpe?g|js|json|map|png|svg|txt|webmanifest|webp|woff2?)$ {
    try_files $uri =404;
}

# Search results should not be indexed; this is a response header, not a robots.txt block.
location = /search {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
}

# The root document and declared React Router routes use the SPA entry point.
location = / {
    try_files /index.html =404;
}

location ~ ^/(?:exchange/?$|search/?$|industries/[^/]+/?$|technologies/[^/]+/?$|packages(?:/[^/]+)?/?$|tests/[^/]+/?$|bundles/[^/]+/?$|providers/?$|experts(?:/[^/]+)?/?$|services/[^/]+/?$|equipment/?$|instruments/[^/]+/?$|institutions/[^/]+/?$|facilities/[^/]+/?$|events(?:/[^/]+)?/?$|cart/?$|login/?$|register/?$|register-provider/?$|forgot-password/?$|reset-password/?$|app(?:/(?:exchange|cart|orders(?:/[^/]+)?|request/[^/]+|invoices))?/?$|admin(?:/(?:analytics|orders(?:/[^/]+)?|bookings|queue|facilities|instruments(?:/[^/]+)?|services(?:/[^/]+)?|experts|catalog|bundles|events|discounts|invoices|users|settings))?/?$|operator/?$|platform(?:/(?:providers(?:/[^/]+)?|buyers(?:/[^/]+)?|orders(?:/[^/]+)?|institutions|settlements|catalog(?:/(?:tests|packages)/[^/]+)?|fee-config|discounts|integrations))?/?$)$ {
    try_files $uri $uri/ /index.html;
}

# Existing root-level public files such as favicon.svg are served only if present.
location / {
    try_files $uri =404;
}
