services:
  db:
    image: postgres:16-alpine
    container_name: rix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rix
      POSTGRES_PASSWORD: rixsecret
      POSTGRES_DB: rix
    ports:
      - "5433:5432"
    volumes:
      - rix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rix -d rix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rix_pgdata:
